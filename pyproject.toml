[project]
name = "smartwatt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["smartwatt-sim", "smartwatt-tariff", "smartwatt-server", "smartwatt-analysis"]

[tool.uv.workspace]
members = ["sim", "tariff", "server", "analysis"]

[tool.uv.sources]
smartwatt-sim = { workspace = true }
smartwatt-tariff = { workspace = true }
smartwatt-server = { workspace = true }
smartwatt-analysis = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "httpx2>=2.10.0",
    "pyserial>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["contract/tests", "sim/tests", "tariff/tests", "server/tests", "analysis/tests", "firmware/tests_py"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
