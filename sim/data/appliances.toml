# Appliances are defined by HARMONIC CURRENT PHASORS, not by a power figure.
#
# phase is the lag of the current harmonic behind the voltage fundamental,
# in radians. i_rms is amps rms at that harmonic order.
#
# This is what lets one model serve both output modes and makes composition
# physically correct: phasors superpose across parallel loads, and distortion
# power does not. Summing per-appliance power figures would reintroduce
# exactly the error PRD.md corrects in the signal chain section.
#
# Reference mains: 240.0 V rms, 50.0 Hz.

[kettle]
trained   = true
protected = false
heating   = true
inrush_ratio        = 1.02
inrush_decay_cycles = 3
settle_cycles       = 3
harmonics = [
  { h = 1, i_rms = 7.500, phase = 0.020 },
  { h = 3, i_rms = 0.038, phase = 0.100 },
  { h = 5, i_rms = 0.015, phase = 0.200 },
]

