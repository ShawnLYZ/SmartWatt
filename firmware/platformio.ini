; SmartWatt firmware.
;
; Everything under lib/ compiles under `native` with no board attached.
; That is US69, and it is what makes the maths debuggable separately from
; the wiring. Only S6's ADC driver is hardware-bound.

[platformio]
default_envs = native

[env]
build_flags = -std=c++17 -Wall -Wextra -Wpedantic -DUNITY_INCLUDE_DOUBLE
; Unity's double-precision floating-point assertions are off by default and must
; be enabled here. All numeric tests in S5a use doubles, so this is a project-wide choice.

[env:native]
platform = native
test_framework = unity
extra_scripts = pre:tools/fixture_dir.py
build_flags =
    ${env.build_flags}
    -DSMARTWATT_NATIVE=1
; `pio test -e native` does not compile src/, but `pio run -e native` does --
; and src/main.cpp is an Arduino sketch that this environment cannot build.
; Excluding it here keeps that from being a compile error (Arduino.h does
; not exist under native). It does not make `pio run -e native` produce a
; program: with src/ empty, native has no framework-supplied main() to link,
; so the command still fails, on "Nothing to build" rather than on
; Arduino.h. See task-4-report.md for the verified detail -- `pio run
; -e native` was not a passing command before this file existed either.
build_src_filter = -<*>

[env:esp32-s3]
; NOTE: this project declares -std=c++17 in [env] above, but the
; espressif32/Arduino framework's own build script
; (platformio-build-esp32s3.py) appends -std=gnu++11 to the compiler command
; line AFTER this file's build_flags, and the LATER flag wins -- so this
; environment compiles as gnu++11 in practice, not c++17, whatever this file
; says. Confirmed by reading platformio-build-esp32s3.py:50, and by the
; payload.cpp Writer aggregate-init failure it caused (see that file's
; comment on the Writer constructor). Consequence: anything under lib/ that
; this environment's link graph reaches must stay C++11-compatible -- no
; inline variables, if constexpr, structured bindings, nested namespace
; definitions, or std::string_view/optional/variant -- even though `pio test
; -e native` builds the same sources under real c++17 and would not catch a
; violation. Deliberately NOT fixed by forcing the standard back to c++17/c11
; here (no build_unflags, no -std=gnu++17): that would change how the ~1 MB of
; framework code this environment also compiles is built, and with no board
; available to a from-source reviewer, a clean compile would not prove the
; framework still behaves the same.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
; The board definition for esp32-s3-devkitc-1 defaults to 8 MB of flash with
; default_8MB.csv. The part this project's procurement record actually orders
; is the ESP32-S3-DevKitC-1 **N16R8** -- 16 MB flash, 8 MB PSRAM -- so the
; default table would leave more than half the flash unaddressable and would
; size the app and SPIFFS/LittleFS partitions for the wrong part. Stated here
; rather than left to the board default so the build matches the ordered
; hardware. (default_16MB.csv ships with the framework's tools/partitions.)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; main.cpp mounts the data partition with LittleFS.begin() and reads
; /littlefs/fingerprints.csv. PlatformIO's `-t uploadfs` builds a SPIFFS image
; unless told otherwise, and LittleFS.begin(true) would format that as corrupt
; on first boot. The trained table would then be erased and the device would
; report "no usable table". data/ is the image's source directory.
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DSMARTWATT_NATIVE=0
    -DBOARD_HAS_PSRAM
    -Werror=frame-larger-than=4096
; The Arduino loop task has an 8 KB stack (CONFIG_ARDUINO_LOOP_STACK_SIZE).
; setup() once built a 43 KB FingerprintTable temporary on it and overflowed
; at boot, before printing a line; the native tests, with megabytes of host
; stack, could not see it. So on the device build, any single function whose
; stack frame exceeds half that stack is a compile error, not a boot loop.
lib_deps =
    knolleary/PubSubClient@^2.8
